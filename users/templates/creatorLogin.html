{% extends "master.html" %}
{% block title %}
Creator Login 
{% endblock %}

{% block content %}
{% include "nav.html" %}

<style>
    .formContainer {
        max-width: 320px;
        width: 100%;
        padding: 40px;
        box-shadow: 0 0 10px black;
        background: transparent;
        border-radius: 30px; 
        text-align: center;
        backdrop-filter: blur(20px);
    }

    .formHeader {
        text-align: center; 
        margin-bottom: 25px; 
        width: bold; 
        font-size: 1rem;
        text-transform: uppercase;
        color: white; 
    }

    .inputContainer {
        position: relative;
        margin-bottom: 20px; 
    }

    .inputContainer input {
        padding: 15px 20px;
        width: 275px;
        border-radius: 30px;
        border: 0px solid white; 
        box-shadow: 0 0 5px black;
        margin-bottom: 20px;
        background: transparent;
        font-size: 1rem;
        outline: none;
        color: black;
    }

    .inputContainer input:hover {
        border: 2px solid rgba(0, 0, 0, 0.304);
    }

    input::placeholder {
        color: white; 
        font-size: 0.8rem;
    }

    
</style>

<div class="formContainer">
    <div class="formHeader">
        <h3> Log In </h3>
    </div>
    <div class="inputContainer">
        <form method="POST">
            {% csrf_token %}
            {{ loginForm.as_p }}
        </form>

        <div class="button">
            <button class="createSubmit" name="login" type="submit">Login</button>
        </div>
        <div class="signup">
            <p> Don't have an account? <a href="{% url 'creatorRegister' %}">Sign Up</a></p>
        </div>
    </div>

</div>

{% endblock %}
